name: pdf-tools

# Pulls the published images from Docker Hub (built by .github/workflows/*).
# This is the "run the real thing" file — no source checkout required.
#
# For local development against your own backend/frontend changes, use
# docker-compose.dev.yml as an override instead (see README.md).

services:
  # FastAPI + PyMuPDF. Deliberately has no host-facing port of its own.
  api:
    image: ${DOCKERHUB_USERNAME}/pdf-tools-api:latest
    container_name: pdf-tools-api
    environment:
      PORT: "8081"
    # `web` shares this container's network namespace (see below), so every
    # host-facing port for the stack is published here.
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/health")
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Next.js server. Handles all browser traffic and proxies /api/pdf/* to the
  # API over localhost.
  web:
    image: ${DOCKERHUB_USERNAME}/pdf-tools-web:latest
    container_name: pdf-tools-web
    # Mirrors a Cloud Run multi-container service: both containers share one
    # network namespace, so http://127.0.0.1:8081 resolves to the API here and
    # in production without rebuilding the image.
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
